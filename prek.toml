minimum_prek_version = "0.4.14"
exclude = '^(target|field)/'

[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "trailing-whitespace"
args = ["--markdown-linebreak-ext=md"]

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "check-yaml"

[[repos.hooks]]
id = "check-json"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "mixed-line-ending"
args = ["--fix=lf"]

[[repos.hooks]]
id = "check-added-large-files"
args = ["--maxkb=500"]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.50.1"

[[repos.hooks]]
id = "typos"
args = ["--force-exclude"]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"

[[repos.hooks]]
id = "actionlint"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "conventional-commit"
name = "Conventional commit message"
entry = "python3 scripts/check-commit-message.py --file"
language = "system"
stages = ["commit-msg"]
