services:
  lobby:
    build: .
    container_name: rm-simulator-lobby
    restart: unless-stopped
    ports:
      - "7791:7791"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
